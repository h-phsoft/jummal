<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jummal | Study Number</title>
    <link href="assets/vendors/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="assets/vendors/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/vendors/bootstrap/ph-bootstrap-colors.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
  </head>
  <body class="p-3 p-md-4">
    <div class="container-fluid">
      <div class="row">
        <div class="col-3 p-0">
          <a href="index.html" style="text-decoration: none; color: #007bff; font-size: 14px;">العودة للرئيسية</a>
        </div>
        <div class="col-6 p-0">
          <h3 class="text-center mb-3 fw-bold">دراسة رقم</h3>
        </div>
        <div class="col-3 p-0">
        </div>
      </div>
      <div class="row mt-1 justify-content-center">
        <div class="col-5 mx-auto p-0 text-center">
          <div class="card mt-1">
            <div class="card-body">
              <div class="row mt-1 justify-content-center">
                <div class="col-10 mx-auto">
                  <div class="input-group">
                    <input type="number" id="studyNumber" class="form-control text-center" placeholder="أدخل الرقم...">
                    <button onclick="performNumberStudy()" class="btn btn-glass" type="button">ادرس</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-6 mx-auto mt-2 text-center">
          <div class="table-wrapper text-center">
            <div id="number-Study-Result">

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery + Bootstrap JS -->
    <script src="assets/vendors/jquery/jquery.min.js"></script>
    <script src="assets/vendors/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="assets/vendors/sheetjs/xlsx.full.min.js"></script>
    <script src="assets/js/number-study.js"></script>
  </body>
</html>
